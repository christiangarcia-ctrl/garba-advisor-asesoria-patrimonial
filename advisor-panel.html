<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel del asesor · GarBa</title><link rel="stylesheet" href="../fonts.css"><style>:root{--navy:#001868;--line:#dce3ee}body{font:14px Inter,system-ui,sans-serif;background:#f5f7fb;color:var(--navy);margin:0;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}h1{font-size:20px}dt{font-size:12px;opacity:.75;margin-top:10px}dd{margin:3px 0 0;font-weight:700}#clock{font-variant-numeric:tabular-nums;font-size:38px;font-weight:800}.alert{color:#001868;font-weight:800}</style></head><body><h1>Panel del asesor</h1><p>Solo en esta ventana. No compartas esta pestaña.</p><section class="card"><strong id="phase">Acto 1 · Diagnóstico</strong><div id="clock">00:00</div><p class="alert" id="signal"></p></section><section class="card"><h2>Diagnóstico</h2><dl><dt>Prioridad</dt><dd id="priority">—</dd><dt>Condición</dt><dd id="condition">—</dd><dt>Barrera</dt><dd id="barrier">—</dd><dt>Aportación</dt><dd id="amount">—</dd><dt>Régimen</dt><dd id="fiscal">—</dd></dl></section><section class="card"><h2>Objeción / decisión</h2><p id="reason">—</p><p>Las respuestas sugeridas están pendientes de revisión de Christian.</p></section><script>(()=>{'use strict';const $=x=>document.getElementById(x);const ch=typeof BroadcastChannel==='function'?new BroadcastChannel('garba-advisor-three-act'):null;const start=Date.now();let act=1,phaseStart=start;function pad(n){return String(n).padStart(2,'0')}setInterval(()=>{const seconds=Math.floor((Date.now()-phaseStart)/1000);$('clock').textContent=pad(Math.floor(seconds/60))+':'+pad(seconds%60);$('signal').textContent=act===2?(seconds>=1080?'Ve a la decisión':seconds>=720?'Pide avanzar':''):''},1000);ch?.addEventListener('message',e=>{if(e.data?.type!=='state')return;const d=e.data.data;if(d.act!==act){act=d.act;phaseStart=Date.now()}$('phase').textContent='Acto '+act+' · '+(['','Diagnóstico','Su número','Decisión'][act]||'');for(const k of ['priority','condition','barrier','fiscal','reason'])$(k).textContent=d[k]||'—';$('amount').textContent=d.amount?Number(d.amount).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}):'—'});ch?.postMessage({type:'ready'})})();</script></body></html>
