<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maqueta · Tu plan en vivo</title>
<link rel="stylesheet" href="../../fonts.css">
<style>
:root{--navy:#001868;--blue:#0830E8;--soft:#EFF6FF;--text:#1c2a3a;--muted:#64748b;--border:#dbe4f0;--bg:#F0F3F8;--success:#0f8a5f;--success-soft:#e8f7f1;--bad:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:Montserrat,system-ui,sans-serif;color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* barra superior */
.top{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px}
.top img{height:30px}
.who{border-left:1px solid var(--border);padding-left:16px;line-height:1.15}
.who b{display:block;font-size:15px;color:var(--navy)}
.who span{font-size:12px;color:var(--muted);font-weight:600}
.acts{display:flex;gap:6px;margin-left:auto}
.act{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:#8a99b3}
.act i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#e7edf7;font-size:12px}
.act.on{background:var(--navy);color:#fff}.act.on i{background:#fff;color:var(--navy)}
.act.done{color:var(--navy)}.act.done i{background:var(--blue);color:#fff}
.duda{border:1.5px solid #c8d7f5;background:#fff;color:var(--navy);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;margin-left:6px}
.duda.on{background:var(--soft)}
.mock{display:flex;gap:2px;padding:3px;border-radius:10px;background:#fff7e0;border:1px dashed #d9a400;margin-left:8px}
.mock span{font-size:10.5px;color:#8a6500;font-weight:800;align-self:center;padding:0 6px}
.mock button{border:0;background:transparent;font-weight:700;font-size:11.5px;padding:5px 8px;border-radius:7px;color:#8a6500}
.mock button.on{background:#8a6500;color:#fff}

/* escenario */
.stage{height:calc(100% - 58px);display:grid;grid-template-columns:460px 1fr;gap:18px;padding:16px 22px 14px}
.side{background:#fff;border:1px solid var(--border);border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;min-height:0;overflow:auto}
.canvas{display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-height:0}

.kicker{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.side h2{font-size:31px;line-height:1.13;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.side h2 em{font-style:normal;color:var(--blue)}.side h2 em.g{color:var(--success)}
.side p.lead{font-size:17px;line-height:1.45;margin-top:10px}
.side .fine{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
.grow{flex:1}

/* historia (respuestas ya dadas) */
.hist{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.hist button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;background:var(--soft);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--muted);font-weight:600}
.hist button b{color:var(--navy);font-weight:700;text-align:right}
.hist button:hover{outline:1.5px solid #c8d7f5}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{border:1.5px solid #c8d7f5;background:#fff;color:var(--navy);font-weight:700;font-size:17px;padding:13px 16px;border-radius:14px;text-align:left;transition:all .15s}
.opt small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}
.opt:hover{border-color:var(--blue)}
.opt.on{background:var(--navy);border-color:var(--navy);color:#fff}.opt.on small{color:#b9c6f0}
.big{display:flex;align-items:center;gap:10px;margin-top:18px;border:2px solid #c8d7f5;border-radius:16px;padding:10px 16px;font-size:30px;font-weight:800;color:var(--navy)}
.big input{border:0;outline:none;font:800 34px Montserrat,sans-serif;color:var(--navy);width:100%;min-width:0}
.big span{font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap}
.go{margin-top:16px;border:0;background:var(--navy);color:#fff;font-weight:800;font-size:17px;padding:14px 20px;border-radius:14px;align-self:flex-start}
.go:disabled{opacity:.35;cursor:default}
.link{border:0;background:transparent;color:var(--blue);font-weight:700;font-size:14px;padding:8px 0;align-self:flex-start}
.me{display:flex;gap:12px;align-items:center;margin-top:18px;padding:12px;border-radius:14px;background:var(--soft)}
.me img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.me b{display:block;color:var(--navy);font-size:15px}.me span{font-size:12.5px;color:var(--muted);font-weight:600}
.path3{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.path3 div{display:flex;gap:12px;align-items:center;font-size:17px;font-weight:700;color:var(--navy)}
.path3 i{font-style:normal;flex:0 0 30px;height:30px;border-radius:50%;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-size:14px;font-weight:800}

/* controles del acto 2 */
.ctls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.ctl{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ctl input,.ctl select{width:100%;min-width:0;border:1.5px solid #c8d7f5;border-radius:10px;padding:8px 10px;font:700 16px Montserrat,sans-serif;color:var(--navy);background:#fff;text-transform:none;letter-spacing:0}
.ctl.bad input{border-color:#d93025;color:var(--bad);background:#fdecec}
.ctl .w{display:none;color:var(--bad);text-transform:none;letter-spacing:0;font-size:11.5px}
.ctl.bad .w{display:block}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--navy);grid-column:1/-1}
.chk input{width:18px;height:18px;accent-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{border:1.5px solid #c8d7f5;background:#fff;color:var(--navy);font-weight:700;font-size:14px;padding:8px 13px;border-radius:999px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ingl{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:14px;font-weight:600;color:var(--navy);background:var(--success-soft);border-radius:999px;padding:4px 6px 4px 14px;align-self:flex-start}
.ingl input{width:100px;border:0;border-radius:999px;padding:6px 10px;font:700 14px Montserrat,sans-serif;color:var(--navy);text-align:right}

/* decisión */
.dec{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.dec .opt{font-size:19px;padding:15px 18px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.mini input{border:1.5px solid #c8d7f5;border-radius:10px;padding:8px 10px;font:600 15px Montserrat,sans-serif;color:var(--navy)}
.mini .full{grid-column:1/-1}

/* lienzo derecho */
.headrow{display:grid;grid-template-columns:1fr 340px;gap:14px}
.why{background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px 22px;display:flex;flex-direction:column;justify-content:center;min-height:118px}
.why q{font-size:27px;line-height:1.2;font-weight:800;color:var(--navy);quotes:"“" "”"}
.why .ghost{font-size:20px;font-weight:700;color:#a7b4cb}
.hero{background:linear-gradient(150deg,var(--navy) 0%,#0a2a9a 100%);color:#fff;border-radius:20px;padding:16px 22px;display:flex;flex-direction:column;justify-content:center;min-height:118px;transition:all .3s}
.hero small{font-size:13.5px;font-weight:600;opacity:.85}
.hero b{display:block;font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:3px 0 1px}
.hero span{font-size:13.5px;opacity:.85}
.hero .sub2{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18);font-size:13.5px}
.hero.empty{background:#fff;color:#a7b4cb;border:1.5px dashed #c8d7f5}
.hero.empty b{font-size:22px}
.chart{background:#fff;border:1px solid var(--border);border-radius:20px;padding:8px 12px 2px;position:relative;min-height:0;display:flex;flex-direction:column}
.chart svg{flex:1;min-height:0;width:100%;display:block}
.legend{position:absolute;right:22px;top:12px;display:flex;gap:16px;font-size:12.5px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:22px;border-top:3px solid var(--navy);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:2.5px dashed #7d93d6}
.disc{font-size:10.5px;color:var(--muted);padding:0 8px 6px}
.steps{display:grid;grid-template-columns:40px repeat(var(--n),1fr) 40px;gap:8px}
.nav{border:1px solid var(--border);background:#fff;border-radius:12px;font-size:20px;color:var(--navy);font-weight:700}
.nav:disabled{opacity:.35;cursor:default}
.step{border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:8px 10px;text-align:left;display:flex;gap:8px;align-items:center}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--soft);color:var(--blue);font-weight:800;font-size:13px;display:grid;place-items:center}
.step b{display:block;font-size:13.5px;color:var(--navy);font-weight:800;line-height:1.15}
.step small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.step.on{background:var(--navy);border-color:var(--navy)}.step.on .n{background:#fff;color:var(--navy)}.step.on b{color:#fff}.step.on small{color:#b9c6f0}
.step.done .n{background:var(--blue);color:#fff}

.axis text{font-size:13px;fill:var(--muted);font-weight:600}
.axis line{stroke:#e3e9f3}
.callout rect{fill:#fff;stroke-width:1.5}
.callout text{font-weight:700;font-size:15px}
.callout text.s{font-weight:600;fill:var(--muted);font-size:12.5px}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.drawing{stroke-dasharray:var(--len);animation:draw 1.6s ease-out both}
.areain{animation:fadein 1.2s .6s both}
.side>*{animation:fadein .25s both}
</style>
</head>
<body>
<div class="top">
  <img src="../../img/logo-garba.png" alt="GarBa">
  <div class="who"><b id="tName">Tu plan de retiro</b><span>Asesoría con Christian García · Distribuidor autorizado Allianz</span></div>
  <div class="acts" id="acts"></div>
  <button class="duda" id="duda">¿Tienes una duda?</button>
  <div class="mock"><span>MAQUETA</span><button id="mPdp" class="on">Con Punto de Partida</button><button id="mNo">Sin</button></div>
</div>
<main class="stage">
  <aside class="side" id="side"></aside>
  <section class="canvas">
    <div class="headrow">
      <div class="why" id="why"></div>
      <div class="hero" id="hero"></div>
    </div>
    <div class="chart"><div class="legend" id="legend"></div><svg id="svg" aria-label="Tu retiro"></svg>
      <div class="disc">Gráfica ilustrativa, sin escala de rendimiento ni garantía de crecimiento. Las inversiones pueden apreciarse o depreciarse.</div></div>
    <div class="steps" id="steps"></div>
  </section>
</main>
<script>
// ===================== estado =====================
const money=v=>'$'+Math.round(v).toLocaleString('es-MX');
const mill=v=>v<1e6?money(v):'$'+(v/1e6).toLocaleString('es-MX',{maximumFractionDigits:1})+' millones';
const calcMensual=f=>{const i=.07/12;return f*(i/(1-Math.pow(1+i,-240)))}; // misma fórmula que la herramienta
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const START=new Date(2026,10,1);
const dateAt=m=>{const d=new Date(START);d.setMonth(d.getMonth()+m);return MESES[d.getMonth()]+' '+d.getFullYear()};
const minPmt=y=>y<=14?3000:2000;

// Prospecto de ejemplo (ficticio) tal como llega de Punto de Partida
const PDP={nombre:'Laura',edad:36,dolor:'Mi AFORE podría no alcanzar',meta:'Mantener mi nivel de vida',porque:'No depender de mis hijos',condicion:'Flexibilidad y acceso',freno:'Temor a comprometerme',metaHoy:30000,pmt:3500,years:20,reg:'151',ing:45000};
let S; // respuestas
function reset(pdp){
  S=pdp?Object.assign({pdp:true},PDP):{pdp:false,nombre:'',edad:null,dolor:null,meta:null,porque:null,condicion:null,freno:null,metaHoy:null,pmt:null,years:25,reg:'151',ing:45000};
  S.reinv=true;S.act=1;S.q=pdp?'resumen':'hola';S.step=0;S.chip=null;S.dec=null;S.duda=false;S.drawnOnce=false;S.reason=null;
  if(!pdp)S.years=25;
  recalc();
}

// ===================== preguntas del acto 1 (mismas opciones que hoy) =====================
const Q=[
 {k:'edad',label:'Edad',t:'Para empezar, <em>¿cuántos años tienes?</em>',num:true,unit:'años',ph:'36'},
 {k:'dolor',label:'Te preocupa',t:'¿Qué te gustaría <em>resolver</em>?',opts:[['Mi AFORE podría no alcanzar','Quiero una fuente adicional de ingreso.'],['No tengo una ruta formal de retiro','Trabajo por mi cuenta o he cotizado irregular.'],['No quiero trabajar por obligación','Que trabajar sea una elección.'],['Proteger a mi familia','Contemplar a quienes dependen de mí.']]},
 {k:'meta',label:'Quieres',t:'¿Qué te gustaría <em>conseguir</em>?',opts:[['Tener ingresos adicionales'],['Mantener mi nivel de vida'],['Trabajar por elección'],['Proteger a mi familia']]},
 {k:'porque',label:'Por qué ahora',t:'¿Por qué es importante <em>empezar ahora</em>?',opts:[['No depender de mis hijos'],['Aprovechar el tiempo'],['Hoy tengo capacidad'],['Dejar de improvisar']]},
 {k:'condicion',label:'No puede faltar',t:'¿Qué tiene que respetar tu plan para que <em>sí te funcione</em>?',opts:[['Flexibilidad y acceso'],['Seguridad y respaldo'],['Beneficio fiscal'],['Rendimiento y riesgo']]},
 {k:'freno',label:'Te había frenado',t:'¿Qué te había <em>frenado</em> hasta hoy?',opts:[['Temor a comprometerme'],['Prioricé otros gastos'],['No encontraba una propuesta adecuada'],['Estuve a punto de contratar uno']]},
 {k:'metaHoy',label:'Te gustaría recibir',t:'¿Cuánto te gustaría <em>recibir al mes</em> en tu retiro?',num:true,unit:'al mes, en pesos de hoy',ph:'30000',money:true},
 {k:'pmt',label:'Puedes apartar',t:'¿Cuánto puedes <em>apartar cada mes</em> sin apretarte?',num:true,unit:'al mes',ph:'3000',money:true,fine:'Sin forzar tu presupuesto: primero un escenario que sí puedas sostener.'},
];
const fmtAns=(q,v)=>v==null||v===''?'':q.k==='edad'?v+' años':q.money?money(v):v;

// ===================== cálculo real (la herramienta en un iframe, mismas fórmulas) =====================
const frame=document.createElement('iframe');frame.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px';
frame.src='../../index.html?flujo=clasico';document.body.appendChild(frame);
let READY=false,D=null;
function tool(reg,reinv){
  const w=frame.contentWindow,doc=w.document;
  const set=(id,v)=>{const e=doc.getElementById(id);if(!e)return;if(e.tagName==='SELECT'&&![...e.options].some(o=>o.value==String(v))){const o=doc.createElement('option');o.value=v;o.textContent=v;e.appendChild(o)}e.disabled=false;e.value=v;e.dispatchEvent(new w.Event('input',{bubbles:true}));e.dispatchEvent(new w.Event('change',{bubbles:true}))};
  set('edad',S.edad);set('years',String(S.years));set('pmt',S.pmt);set('regimenFiscal',reg);if(reg==='151')set('ingresoMensualCliente',S.ing);
  if(S.metaHoy)set('metaHoy',S.metaHoy);
  const ck=doc.getElementById('reinvertISR');if(ck){ck.checked=reinv;ck.dispatchEvent(new w.Event('change',{bubbles:true}))}
  w.calcAccum();try{w.updateSuggestion&&w.updateSuggestion()}catch(e){}
  const s=w.eval('reportState');
  return {fondoPlan:s.fondoPlan,fondo65:s.fondo65,fondo60:s.fondo60,dev1:s.devolucionFiscalPrimerAnoVista??s.devolucionFiscalPrimerAno,impacto65:s.impactoISR65,sug:s.pmtSugerido,infl:s.infl||4};
}
function maxYears(){return [10,15,20,25].filter(y=>!S.edad||S.edad+y<=65)}
function recalc(){
  if(S.edad){const ok=maxYears();if(!ok.includes(+S.years))S.years=ok[ok.length-1]||10}
  if(READY&&S.edad&&S.pmt){
    const r=S.reg==='93'?tool('93',false):tool('151',S.reinv);
    if(S.reg==='151'&&!S.reinv)r.impacto65=0;
    D=r;
  }else D=null;
  render();
}

// ===================== render =====================
const $=id=>document.getElementById(id);
function render(){renderTop();renderSide();renderCanvas()}

function renderTop(){
  $('tName').textContent=S.nombre?'El plan de retiro de '+S.nombre:'Tu plan de retiro';
  const A=[['Tu porqué'],['Tu número'],['Tu decisión']];
  $('acts').innerHTML=A.map((a,i)=>'<button class="act'+(S.act===i+1?' on':S.act>i+1?' done':'')+'" data-a="'+(i+1)+'"><i>'+(S.act>i+1?'✓':i+1)+'</i>'+a[0]+'</button>').join('');
  $('acts').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>goAct(+b.dataset.a));
  $('duda').classList.toggle('on',S.duda);
}
function goAct(a){
  if(a>1&&!(S.edad&&S.pmt)){ // atajo: sin datos todavía, se piden ahí mismo
    S.act=1;S.q=!S.edad?0:7;S.duda=false;render();return}
  S.act=a;S.duda=false;S.step=0;S.chip=null;render();
}

// ---------- columna izquierda ----------
function hist(){
  const items=Q.filter(q=>S[q.k]!=null&&S[q.k]!=='');
  if(!items.length)return'';
  return '<div class="hist">'+items.map(q=>'<button data-edit="'+Q.indexOf(q)+'"><span>'+q.label+'</span><b>'+fmtAns(q,S[q.k])+'</b></button>').join('')+'</div>';
}
function renderSide(){
  const sd=$('side');let h='';
  if(S.duda){h=dudaHTML()}
  else if(S.act===1){
    if(S.q==='hola'){
      h='<div class="kicker">Bienvenida</div><h2>Hoy vamos a <em>dibujar tu retiro</em>, juntos.</h2>'+
        '<div class="path3"><div><i>1</i>Entendemos qué quieres resolver</div><div><i>2</i>Vemos tu número</div><div><i>3</i>Decides el siguiente paso</div></div>'+
        '<p class="lead">Cada respuesta va construyendo tu gráfica, ahí a la derecha.</p>'+
        '<div class="me"><img src="../../img/foto-credencial-christian.jpg" alt=""><div><b>Christian García</b><span>Asesor autorizado CNSF · Cédula G384982<br>Distribuidor autorizado Allianz</span></div></div>'+
        '<div class="grow"></div><button class="go" id="start">Empecemos →</button>';
    }else if(S.q==='resumen'){
      h='<div class="kicker">'+(S.pdp?'Punto de partida':'Esto es lo que entendí')+'</div><h2>'+(S.pdp?(S.nombre?S.nombre+', esto ':'Esto ')+'es lo que <em>ya me contaste</em>.':'Esto es lo que <em>entendí de ti</em>.')+'</h2>'+
        '<p class="lead" style="margin-bottom:14px">'+(S.pdp?'Con eso ya dibujamos tu retiro. ¿Sigue siendo así?':'¿Te representa?')+'</p>'+hist()+
        '<div class="grow"></div><button class="go" id="toNum">Sí, así es · ver mi número →</button><button class="link" id="fix">Quiero ajustar algo</button>';
    }else{
      const q=Q[S.q],n=Q.length;
      h='<div class="kicker">Tu porqué · '+(S.q+1)+' de '+n+'</div>'+hist()+'<h2>'+q.t+'</h2>';
      if(q.opts)h+='<div class="opts">'+q.opts.map(o=>'<button class="opt'+(S[q.k]===o[0]?' on':'')+'" data-o="'+o[0]+'">'+o[0]+(o[1]?'<small>'+o[1]+'</small>':'')+'</button>').join('')+'</div>';
      if(q.num)h+='<label class="big">'+(q.money?'$':'')+'<input id="qn" type="number" inputmode="numeric" placeholder="'+q.ph+'" value="'+(S[q.k]??'')+'"><span>'+q.unit+'</span></label>'+(q.fine?'<p class="fine">'+q.fine+'</p>':'')+'<button class="go" id="qok">Listo →</button>';
      h+='<div class="grow"></div><button class="link" id="skip">Ir directo a tu número →</button>';
    }
  }else if(S.act===2){h=numSide()}
  else h=decSide();
  sd.innerHTML=h;wireSide();
}
function wireSide(){
  const sd=$('side');
  sd.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{S.act=1;S.q=+b.dataset.edit;render()});
  if($('start'))$('start').onclick=()=>{S.q=0;render()};
  if($('toNum'))$('toNum').onclick=()=>goAct(2);
  if($('fix'))$('fix').onclick=()=>{S.q=1;render()};

  if(cur&&cur.refund){for(let y=1;y<=S.years;y++){const m=y*12-6;g+='<circle cx="'+X(m)+'" cy="'+Y(pts[m])+'" r="5.5" fill="#0f8a5f" stroke="#fff" stroke-width="2"/>'}
    g+=callout(X(30)+8,Y(pts[30])-22,'+'+money(D.dev1)+' de vuelta','el primer año · cada punto es un año','right','#0f8a5f')}
  if(cur&&cur.at60){const M60=(60-age)*12;g+='<line x1="'+X(M60)+'" x2="'+X(M60)+'" y1="'+Y(pts[M60])+'" y2="'+base+'" stroke="#0830E8" stroke-dasharray="4 4"/>'+dot(M60)+callout(X(M60)-14,Y(pts[M60])-18,money(calcMensual(D.fondo60))+' al mes','desde los 60 · Art. 93','left')}
  sv.innerHTML=g;
  const ln=$('ln');if(ln&&anim){ln.style.setProperty('--len',ln.getTotalLength())}
}
addEventListener('resize',()=>drawChart());

// ===================== arranque =====================
$('duda').onclick=()=>{S.duda=!S.duda;S.dq=null;render()};
$('side').addEventListener('click',e=>{if(e.target.id==='dqb'){S.dq=null;render()}});
$('mPdp').onclick=()=>{$('mPdp').classList.add('on');$('mNo').classList.remove('on');reset(true)};
$('mNo').onclick=()=>{$('mNo').classList.add('on');$('mPdp').classList.remove('on');reset(false)};
const qs=new URLSearchParams(location.search);
reset(qs.get('pdp')!=='0');
if(qs.get('pdp')==='0'){$('mNo').classList.add('on');$('mPdp').classList.remove('on')}
frame.onload=()=>setTimeout(()=>{READY=true;
  if(qs.get('act'))S.act=+qs.get('act');if(qs.get('step'))S.step=+qs.get('step');if(qs.get('q'))S.q=isNaN(+qs.get('q'))?qs.get('q'):+qs.get('q');if(qs.get('dec'))S.dec=qs.get('dec');if(qs.get('reg'))S.reg=qs.get('reg');
  recalc()},300);
</script>
